<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار إدارة الصراعات التفاعلي | رؤية 2030</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #006C35; /* أخضر الرؤية */
            --secondary-color: #8E793E; /* ذهبي */
            --dark-blue: #1A237E;
            --light-bg: #f8f9fa;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--light-bg);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-container {
            max-width: 800px;
            width: 90%;
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }

        header {
            border-bottom: 2px solid var(--primary-color);
            margin-bottom: 30px;
            padding-bottom: 10px;
        }

        .vision-logo {
            font-weight: bold;
            color: var(--primary-color);
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .progress-bar {
            height: 10px;
            background: #e0e0e0;
            border-radius: 5px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-box {
            display: none; /* سيظهر بواسطة JS */
            animation: fadeIn 0.5s ease;
        }

        .question-box.active {
            display: block;
        }

        .scenario-text {
            font-size: 1.2rem;
            margin-bottom: 20px;
            color: var(--dark-blue);
            background: #f0f4f1;
            padding: 15px;
            border-radius: 10px;
            border-right: 5px solid var(--primary-color);
        }

        .options-list {
            list-style: none;
            padding: 0;
        }

        .option-item {
            background: #fff;
            border: 2px solid #ddd;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        .option-item:hover {
            border-color: var(--secondary-color);
            background-color: #fffdf5;
        }

        .option-item.correct {
            border-color: #27ae60;
            background-color: #d4edda;
        }

        .option-item.wrong {
            border-color: #c0392b;
            background-color: #f8d7da;
        }

        .score-section {
            display: none;
        }

        .btn {
            background: var(--primary-color);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 20px;
        }

        .btn:disabled {
            background: #ccc;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media print {
            .btn, .progress-bar { display: none; }
            .question-box { display: block !important; border-bottom: 1px solid #ddd; padding: 20px 0; }
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <header>
        <div class="vision-logo">SAUDI VISION 2030</div>
        <h2>اختبار إدارة الصراعات الاستراتيجية</h2>
        <p>قم بحل 20 سيناريو عملي لتطوير مهاراتك القيادية</p>
    </header>

    <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <div id="quizBody">
        </div>

    <div id="scoreSection" class="score-section">
        <h3>انتهى الاختبار!</h3>
        <p id="finalScoreText"></p>
        <button class="btn" onclick="location.reload()">إعادة الاختبار</button>
        <button class="btn" style="background:var(--dark-blue)" onclick="window.print()">تحميل نتائجي PDF</button>
    </div>
</div>

<script>
    const quizData = [
        {
            q: "موظفون يرفضون استخدام نظام التحول الرقمي الجديد ويفضلون العمل الورقي. ما التصرف الأمثل؟",
            options: ["إجبارهم بقرار إداري صارم", "تجاهلهم حتى يتقاعدوا", "إشراكهم في التدريب ومنحهم حوافز تقنية", "إلغاء النظام الجديد"],
            correct: 2,
            feedback: "إشراك الموظفين (Collaborating) يقلل المقاومة ويبني الولاء للرؤية."
        },
        {
            q: "قسم التسويق يعد بتسليم المنتج في يومين، بينما الإنتاج يحتاج أسبوعاً. كيف تحل الصراع؟",
            options: ["توبيخ قسم المبيعات", "خفض جودة المنتج لتسريعه", "توحيد المعايير بين القسمين (Alignment)", "إلغاء الطلبات المتأخرة"],
            correct: 2,
            feedback: "المحاذاة تضمن مصداقية العلامة التجارية أمام العميل."
        },
        {
            q: "منافس خفض أسعاره بنسبة 30% لجذب عملائك في السوق السعودي. رد فعلك التسويقي؟",
            options: ["خفض السعر فوراً لنفس المستوى", "التركيز على القيمة المضافة والجودة (Differentiation)", "إغلاق الشركة", "رفع شكوى كيدية ضد المنافس"],
            correct: 1,
            feedback: "في الرؤية، التميز بالقيمة (Value) أقوى من حروب الأسعار الهدامة."
        }
        // يمكن إضافة الـ 17 سيناريو المتبقية هنا بنفس النمط
    ];

    let currentQuestion = 0;
    let score = 0;

    const quizBody = document.getElementById('quizBody');
    const progressFill = document.getElementById('progressFill');

    function loadQuestion() {
        const data = quizData[currentQuestion];
        let optionsHTML = data.options.map((opt, index) => 
            `<li class="option-item" onclick="checkAnswer(${index})">${opt}</li>`
        ).join('');

        quizBody.innerHTML = `
            <div class="question-box active">
                <p>السؤال ${currentQuestion + 1} من ${quizData.length}</p>
                <div class="scenario-text">${data.q}</div>
                <ul class="options-list">${optionsHTML}</ul>
                <p id="feedback" style="display:none; color: var(--primary-color); font-weight:bold;"></p>
                <button id="nextBtn" class="btn" style="display:none" onclick="nextQuestion()">السؤال التالي</button>
            </div>
        `;
    }

    window.checkAnswer = function(selectedIndex) {
        const data = quizData[currentQuestion];
        const options = document.querySelectorAll('.option-item');
        
        if (selectedIndex === data.correct) {
            options[selectedIndex].classList.add('correct');
            score++;
        } else {
            options[selectedIndex].classList.add('wrong');
            options[data.correct].classList.add('correct');
        }

        document.getElementById('feedback').innerText = data.feedback;
        document.getElementById('feedback').style.display = 'block';
        document.getElementById('nextBtn').style.display = 'inline-block';
        
        // منع الضغط المتكرر
        options.forEach(opt => opt.style.pointerEvents = 'none');
    };

    window.nextQuestion = function() {
        currentQuestion++;
        progressFill.style.width = (currentQuestion / quizData.length) * 100 + '%';
        
        if (currentQuestion < quizData.length) {
            loadQuestion();
        } else {
            showScore();
        }
    };

    function showScore() {
        quizBody.style.display = 'none';
        document.getElementById('scoreSection').style.display = 'block';
        document.getElementById('finalScoreText').innerText = `لقد أجبت على ${score} من أصل ${quizData.length} أسئلة بشكل صحيح.`;
    }

    loadQuestion();
</script>

</body>
</html>
